name: Website

# Publishes web/ to GitHub Pages. Only from main (a release decision) or by hand; Pages must be enabled
# once in the repository settings with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths: ["web/**", "themes/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Static checks
        run: python3 web/tools/check.py
      - name: Assemble the site (the tools and the README stay out)
        run: rsync -a --exclude tools/ --exclude README.md web/ _site/
      - name: Stamp the version on every reference (no mixed caches after a deploy)
        run: python3 web/tools/stamp.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
