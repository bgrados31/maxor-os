name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    name: Evaluar el flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check --no-build
      - name: Evaluar el sistema nitro
        run: nix eval --raw .#nixosConfigurations.nitro.config.system.build.toplevel.drvPath
      - name: Pruebas de la CLI (bats, shellcheck, catálogo de mensajes)
        run: nix build .#checks.x86_64-linux.cli-tests --print-build-logs
      - name: Pantalla completa (compila y corre go test)
        run: nix build .#packages.x86_64-linux.maxor-tui --print-build-logs
