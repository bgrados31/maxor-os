name: Suggest a theme
description: Suggest or submit a theme for Maxor OS
labels: [theme]
body:
  - type: input
    id: name
    attributes:
      label: Theme name
    validations:
      required: true
  - type: textarea
    id: palette
    attributes:
      label: Palette
      description: Paste the `colors.json` (all eight keys, as `#rrggbb`).
      render: json
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: License
      options: ["CC0-1.0", "MIT", "CC-BY-4.0", "Other (state it below)"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Screenshots, references and the license if you chose "Other".
