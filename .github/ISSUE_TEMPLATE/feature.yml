name: Suggest an improvement
description: An idea for Maxor OS
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it. If it already exists in another project, link it.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      options: ["Phase 2: repo and CLI", "Phase 3: themes", "Phase 4: shell and greeter", "Phase 5: store", "Phase 6: boot and installer", "I don't know"]
