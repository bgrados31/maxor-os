name: Report a bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. I run `maxor theme apply glaciar`
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `nixos-version`, `maxor version`, and the GPU (`lspci | grep -E 'VGA|3D'`).
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`maxor logs --last` and `journalctl --user -b -p err --no-pager | tail -n 30`"
      render: text
